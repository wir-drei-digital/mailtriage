name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to release (must match Cargo.toml)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.ref.outputs.tag }}
      sha: ${{ steps.ref.outputs.sha }}
      version: ${{ steps.ref.outputs.version }}
      prerelease: ${{ steps.ref.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag and resolve its commit
        id: ref
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?', tag):
              raise SystemExit('Expected a version tag such as v0.1.0 or v0.2.0-rc.1')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'tag={tag}\nversion={tag[1:]}\nprerelease={str("-" in tag).lower()}\n')
          PY
          sha="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          git merge-base --is-ancestor "$sha" origin/main
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
      - name: Require the tag to match the package version
        env:
          RELEASE_SHA: ${{ steps.ref.outputs.sha }}
          RELEASE_VERSION: ${{ steps.ref.outputs.version }}
        run: |
          set -euo pipefail
          git show "${RELEASE_SHA}:Cargo.toml" > /tmp/release-Cargo.toml
          python3 - <<'PY'
          import os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path('/tmp/release-Cargo.toml').read_text())['package']['version']
          if version != os.environ['RELEASE_VERSION']:
              raise SystemExit(f'Tag does not match package version {version}')
          PY

  binaries:
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      expected_version: ${{ needs.prepare.outputs.version }}

  publish:
    needs: [prepare, binaries]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # One publish at a time across all tags: a later one waits for the
    # running one and never cancels it.
    concurrency:
      group: release-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      # Cone mode also checks out the files at the root, install.sh included.
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: mailtriage-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: tray-*
          merge-multiple: true
          path: dist
      - name: Check downloaded assets
        run: |
          set -euo pipefail
          cd dist
          archives=(*.tar.gz)
          manifests=(*.tar.gz.sha256)
          trays=(mailtriage-tray-v*.tar.gz)
          # Three CLI and three tray archives, each with its checksum file.
          test "${#archives[@]}" -eq 6
          test "${#manifests[@]}" -eq 6
          test "${#trays[@]}" -eq 3
          cat "${manifests[@]}" > SHA256SUMS
          sha256sum --check SHA256SUMS
      # The copy attached to the release installs that release by default.
      - name: Attach install.sh
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          sed "s/^default_version=''\$/default_version='$RELEASE_VERSION'/" install.sh > dist/install.sh
          grep -qx "default_version='$RELEASE_VERSION'" dist/install.sh
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          assets=(dist/*.tar.gz dist/*.sha256 dist/SHA256SUMS dist/install.sh)
          if gh release view "$RELEASE_TAG" --json isDraft > /tmp/existing-release.json 2>/dev/null; then
            jq -e '.isDraft == true' /tmp/existing-release.json > /dev/null || {
              echo 'Release is already published; assets will not be overwritten.' >&2
              exit 1
            }
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            extra=()
            if [ "$PRERELEASE" = true ]; then extra+=(--prerelease); fi
            gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag \
              --target "$RELEASE_SHA" --title "mailtriage $RELEASE_TAG" \
              --generate-notes --draft "${extra[@]}"
          fi
          if [ "$PRERELEASE" = true ]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            # Latest only when no published stable release is higher.
            gh release list --exclude-drafts --exclude-pre-releases --limit 1000 \
              --json tagName > /tmp/published-releases.json
            if python3 .github/scripts/is_highest_release.py "$RELEASE_TAG" /tmp/published-releases.json; then
              gh release edit "$RELEASE_TAG" --draft=false --latest
            else
              gh release edit "$RELEASE_TAG" --draft=false --latest=false
            fi
          fi
          gh release view "$RELEASE_TAG" --json url --jq '.url' >> "$GITHUB_STEP_SUMMARY"

  # The Homebrew tap follows the highest stable release, one update at a
  # time, and never moves backwards. Without HOMEBREW_TAP_TOKEN (contents
  # write on wir-drei-digital/homebrew-tap only) it ends with a notice; the
  # release stays published either way, and this job can be re-run.
  homebrew:
    name: Homebrew tap
    needs: [prepare, publish]
    if: needs.prepare.outputs.prerelease == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: homebrew-tap
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          sparse-checkout: |
            .github/scripts
            packaging/homebrew
          persist-credentials: false
      - name: Only the highest stable release
        id: highest
        run: |
          set -euo pipefail
          gh release list --exclude-drafts --exclude-pre-releases --limit 1000 \
            --json tagName > "$RUNNER_TEMP/published-releases.json"
          if python3 .github/scripts/is_highest_release.py "$RELEASE_TAG" "$RUNNER_TEMP/published-releases.json"; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$RELEASE_TAG is not the highest stable release; the tap keeps its formula"
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Without HOMEBREW_TAP_TOKEN
        if: steps.highest.outputs.go == 'true' && env.HOMEBREW_TAP_TOKEN == ''
        run: echo "::notice::HOMEBREW_TAP_TOKEN is not set, so the tap was not updated; set it and re-run this job"
      - name: Render the formula
        if: steps.highest.outputs.go == 'true' && env.HOMEBREW_TAP_TOKEN != ''
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" --pattern SHA256SUMS --dir "$RUNNER_TEMP"
          sh packaging/homebrew/render.sh "$RELEASE_VERSION" "$RUNNER_TEMP/SHA256SUMS" > "$RUNNER_TEMP/mailtriage.rb"
          ruby -c "$RUNNER_TEMP/mailtriage.rb"
      - uses: actions/checkout@v7.0.1
        if: steps.highest.outputs.go == 'true' && env.HOMEBREW_TAP_TOKEN != ''
        with:
          repository: wir-drei-digital/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Commit and push, never backwards
        if: steps.highest.outputs.go == 'true' && env.HOMEBREW_TAP_TOKEN != ''
        run: bash packaging/homebrew/publish.sh tap "$RUNNER_TEMP/mailtriage.rb" "$RELEASE_VERSION"
