name: Release binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-amd64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - name: Smoke test binary
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          cd "$tmp_dir"
          "$GITHUB_WORKSPACE/target/release/mailtriage" init --json
          "$GITHUB_WORKSPACE/target/release/mailtriage" classify --account work --input "$GITHUB_WORKSPACE/examples/reply-request.eml" --format rfc822 --json
          "$GITHUB_WORKSPACE/target/release/mailtriage" list --account work --view all --json
      - name: Package and checksum
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/mailtriage dist/mailtriage
          cd dist
          tar -czf "mailtriage-${{ matrix.platform }}.tar.gz" mailtriage
          shasum -a 256 "mailtriage-${{ matrix.platform }}.tar.gz" > "mailtriage-${{ matrix.platform }}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: mailtriage-${{ matrix.platform }}
          path: |
            dist/mailtriage-${{ matrix.platform }}.tar.gz
            dist/mailtriage-${{ matrix.platform }}.tar.gz.sha256
