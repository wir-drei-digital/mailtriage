# Dovecot 2.3 for tests/e2e/run.sh: no namespace prefix, separator "/".
# Throwaway test server: plaintext IMAP, one static password for any user.
protocols = imap
listen = *
ssl = no
disable_plaintext_auth = no
auth_mechanisms = plain login
mail_location = maildir:/srv/mail/%u
first_valid_uid = 1000
passdb {
  driver = static
  args = password=e2e-pass
}
userdb {
  driver = static
  args = uid=1000 gid=1000 home=/srv/mail/%u allow_all_users=yes
}
namespace inbox {
  inbox = yes
  separator = /
  prefix =
  mailbox Sent {
    special_use = \Sent
    auto = create
  }
  mailbox Trash {
    special_use = \Trash
    auto = create
  }
  mailbox Archive {
    special_use = \Archive
    auto = create
  }
}
log_path = /dev/stderr
