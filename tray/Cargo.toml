[package]
name = "mailtriage-tray"
version = "0.1.0"
edition = "2021"
description = "Menu bar and tray app for mailtriage"
license = "MIT"

[lib]
name = "mailtriage_tray"
path = "src/lib.rs"

[[bin]]
name = "mailtriage-tray"
path = "src/main.rs"

[dependencies]
arboard = { version = "3", default-features = false }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.35", default-features = false, features = ["glow", "accesskit", "default_fonts", "wayland", "x11"] }
fs2 = "0.4"
libc = "0.2"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tao = "0.37"
tempfile = "3"
tray-icon = "0.26"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSRunningApplication"] }

[dev-dependencies]
egui_kittest = { version = "0.35", features = ["eframe", "snapshot", "wgpu"] }
image = { version = "0.25", default-features = false, features = ["png"] }
